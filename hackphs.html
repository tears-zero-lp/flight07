<style>

<script>

    cloud.position.set(cx,950+Math.random()*500,cz);cloud.userData.drift=20+Math.random()*18;s.add(cloud);clouds.push(cloud);
  }
  const blockGeo=new THREE.BoxGeometry(1,1,1),cityBuildings=[],cityRoofs=[],cityWindows=[];
  const cityBody=new THREE.MeshLambertMaterial({color:0xffffff});
  const cityWindowMat=new THREE.MeshLambertMaterial({color:0xffffff,emissive:0x08141a});
  const cityRoadMat=new THREE.MeshLambertMaterial({color:0xffffff});
  const cityRoofMat=new THREE.MeshLambertMaterial({color:0xffffff});
  const tmpObj=new THREE.Object3D(),tmpColor=new THREE.Color();
  const addInstance=(list,x,y,z,w,h,d,color)=>list.push({x,y,z,w,h,d,color});
  for(let ix=-23;ix<=23;ix++)for(let iz=-65;iz<=20;iz++){
    const x=ix*320,z=iz*350;
    if(Math.abs(x)<900&&z>-3600&&z<1700)continue;
    const downtown=Math.abs(x)<1900&&z<-4300&&z>-14500;
    const width=125+Math.random()*95,depth=140+Math.random()*105;
    const height=downtown?45+Math.random()*205:18+Math.random()*62;
    const bodyColor=downtown?[0x68727a,0x747573,0x8b8173,0x515e68,0x9a9385][Math.floor(Math.random()*5)]
      :[0x73787a,0x898477,0x9b9689,0x5f6b70,0x77796f][Math.floor(Math.random()*5)];
    addInstance(cityBuildings,x,height/2+.2,z,width,height,depth,bodyColor);
    addInstance(cityRoofs,x,height+.62,z,width+2,1.2,depth+2,downtown?0x9a9589:0x777a78);
    const columns=Math.max(2,Math.min(4,Math.floor(width/38))),rows=Math.max(2,Math.min(5,Math.floor(height/18)));
    for(let row=0;row<rows;row++)for(let col=0;col<columns;col++){
      const wx=x-width/2+(col+.5)*width/columns;
      const wy=height*(row+1)/(rows+1)+.2;
      addInstance(cityWindows,wx,wy,z+depth/2+.45,Math.min(7,width/columns*.42),Math.min(5,height/(rows+1)*.42),.7,
        Math.random()<.22?0xb9955d:0x35515e);
    }
  }
  const putInstances=(list,material)=>{const mesh=new THREE.InstancedMesh(blockGeo,material,list.length);
    list.forEach((item,i)=>{tmpObj.position.set(item.x,item.y,item.z);tmpObj.scale.set(item.w,item.h,item.d);tmpObj.rotation.set(0,0,0);tmpObj.updateMatrix();
      mesh.setMatrixAt(i,tmpObj.matrix);mesh.setColorAt(i,tmpColor.setHex(item.color))});
    mesh.instanceMatrix.needsUpdate=true;if(mesh.instanceColor)mesh.instanceColor.needsUpdate=true;s.add(mesh);return mesh};
  putInstances(cityBuildings,cityBody);putInstances(cityRoofs,cityRoofMat);
  const cityWindowMesh=putInstances(cityWindows,cityWindowMat);
  const roadX=[],roadZ=[];
  for(let ix=-23;ix<23;ix++){
    const x=(ix+.5)*320;
    if(Math.abs(x)<900){
      roadX.push({x,y:.25,z:4400,w:24,h:.08,d:5200,color:0x363b3e});
      roadX.push({x,y:.25,z:-13800,w:24,h:.08,d:19200,color:0x363b3e});
    }else roadX.push({x,y:.25,z:-8100,w:24,h:.08,d:30000,color:0x363b3e});
  }
  for(let iz=-65;iz<20;iz++){
    const z=(iz+.5)*350;
    if(z>-3600&&z<1700)continue;
    roadZ.push({x:0,y:.15,z,w:15000,h:.08,d:22,color:0x363b3e});
  }
  putInstances(roadX,cityRoadMat);putInstances(roadZ,cityRoadMat);
  const rig=new THREE.Group(),dk=0x15181d;
  bx(rig,2.4,.5,.7,0x1b1f25,0,-.62,-.85);bx(rig,2.4,.12,.9,0x0f1115,0,-.33,-.95);
  bx(rig,.1,2,.1,dk,-.95,.2,-.9);bx(rig,.1,2,.1,dk,.95,.2,-.9);bx(rig,2.4,.1,.1,dk,0,.75,-.9);
  bx(rig,.5,.02,.3,0x113322,-.4,-.36,-.8,0x1d9a5a);bx(rig,.5,.02,.3,0x331c0a,.4,-.36,-.8,0xf2b84b);
  const yk=new THREE.Group(),tor=new THREE.Mesh(new THREE.TorusGeometry(.15,.02,8,20),M(0x222222));tor.rotation.x=1.2;yk.add(tor);bx(yk,.04,.04,.3,0x222222,0,-.05,.12);yk.position.set(0,-.4,-.55);rig.add(yk);
  const P={x:0,z:phase==='land'?4000:900,yaw:0};let roll=0,sh=0,crashT=-1;
  const blast=new THREE.Group();blast.visible=false;s.add(blast);
  const fireMaterial=(color,opacity,glow=true)=>new THREE.MeshLambertMaterial({color,emissive:glow?color:0,emissiveIntensity:1.3,transparent:true,opacity,depthWrite:false});
  const fireGeo=new THREE.SphereGeometry(1,20,14);
  const fireballs=[];
  for(let i=0;i<13;i++){
    const angle=i*2.399,ring=i<7?1.1:2.2,radius=i<7?3.8:2.5;
    const material=fireMaterial(i%4===0?0xffc04c:i%3===0?0xe94717:0xff761d,.96);
    const flame=new THREE.Mesh(fireGeo,material);
    flame.userData={x:Math.cos(angle)*ring,y:(i%4)*.45,z:Math.sin(angle)*ring,radius,phase:(i%5)*.055};
    blast.add(flame);fireballs.push(flame);
  }
  const flashCore=new THREE.Mesh(new THREE.SphereGeometry(1,20,14),fireMaterial(0xffedb0,1));
  blast.add(flashCore);
  const smokeGeo=new THREE.SphereGeometry(1,18,12),smokePuffs=[];
  for(let i=0;i<11;i++){
    const angle=i*2.399,material=fireMaterial(i%3===0?0x514941:0x383735,.01,false);
    const puff=new THREE.Mesh(smokeGeo,material);
    puff.userData={x:Math.cos(angle)*(1.4+i%3*.55),y:(i%5)*.75,z:Math.sin(angle)*(1.4+i%3*.55),size:2.8+(i%4)*.8,phase:i*.035};
    blast.add(puff);smokePuffs.push(puff);
  }
  const sparks=[];
  for(let i=0;i<16;i++){
    const material=fireMaterial(i%4===0?0xffe7a1:0xe95b22,1);
    const spark=new THREE.Mesh(new THREE.SphereGeometry(1,8,6),material);
    const direction=new THREE.Vector3(Math.sin(i*2.37),.25+(i%5)*.23,-Math.cos(i*1.71)).normalize();
    spark.userData={direction,speed:20+(i%6)*5,size:.045+(i%3)*.025};
    blast.add(spark);sparks.push(spark);
  }
  const debris=[];
  const debrisGeo=new THREE.TetrahedronGeometry(1,0);
  for(let i=0;i<9;i++){
    const shardMaterial=M([0x24282a,0x514638,0x797064][i%3]);
    shardMaterial.transparent=true;shardMaterial.depthWrite=false;
    const shard=new THREE.Mesh(debrisGeo,shardMaterial);
    shard.userData={direction:new THREE.Vector3(Math.sin(i*3.1),.2+(i%4)*.2,Math.cos(i*2.2)).normalize(),
      speed:11+(i%5)*3,spin:new THREE.Vector3(.8+i*.11,1.1, .6+i*.08)};
    shard.scale.set(.16+(i%3)*.07,.1+(i%2)*.06,.38+(i%4)*.08);
    blast.add(shard);debris.push(shard);
  }
  const blastLight=new THREE.PointLight(0xff762e,0,320);blast.add(blastLight);
  const explode=()=>{if(crashT>=0)return;crashT=0;blast.visible=true;cityWindowMesh.visible=false;
    clouds.forEach(cloud=>cloud.visible=false);blast.position.set(P.x,5,P.z-24);
    const flash=document.createElement('div');flash.id='crashFx';document.body.appendChild(flash)};
  return{scene:s,rig,explode,update(dt){if(!S)return;
    if(crashT>=0){
      crashT+=dt;
      const progress=Math.min(1,crashT/4.8),fireFade=Math.max(0,1-crashT/1.65);
      const flashScale=.15+Math.min(1,crashT/.32)*5;
      flashCore.scale.set(flashScale,flashScale*.8,flashScale);
      flashCore.material.opacity=Math.max(0,1-crashT/.42);
      fireballs.forEach((flame,i)=>{
        const {x,y,z,radius,phase}=flame.userData,age=Math.max(0,crashT-phase);
        const growth=Math.min(1,age/.42),flicker=1+Math.sin(crashT*18+i*2.1)*.07;
        flame.position.set(x*growth,y+age*2.1,z*growth);
        flame.scale.set(radius*growth*flicker,radius*growth*(1+growth*.32),radius*growth*flicker);
        flame.material.opacity=fireFade*Math.min(1,age/.08)*.92;
      });
      smokePuffs.forEach((puff,i)=>{
        const {x,y,z,size,phase}=puff.userData,age=Math.max(0,crashT-phase);
        const growth=Math.min(1,age/1.35),billow=1+Math.sin(age*2.2+i)*.08;
        puff.position.set(x*(.35+growth),y+age*5.2,z*(.35+growth));
        puff.scale.set(size*growth*billow,size*growth*1.18,size*growth*billow);

      blastLight.intensity=crashT<.25?26*(1-crashT/.25):crashT<.9?4*(1-(crashT-.25)/.65):0;
      sparks.forEach(spark=>{
        const {direction,speed,size}=spark.userData,age=crashT;
        spark.position.copy(direction).multiplyScalar(speed*age);
        spark.position.y+=2.5*age-4.9*age*age;
        spark.scale.set(size*.55,size*.55,size*Math.max(.05,1-age/1.8)*5);
        spark.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),direction);
        spark.material.opacity=Math.max(0,1-age/1.8);
      });
      debris.forEach(shard=>{
        const {direction,speed,spin}=shard.userData,age=crashT;
        shard.position.copy(direction).multiplyScalar(speed*age);
        shard.position.y+=1.5*age-4.9*age*age;
        shard.rotation.set(spin.x*age,spin.y*age,spin.z*age);
        shard.material.opacity=Math.max(0,1-age/2.8);
      });
      sh=progress<.5?(1-progress)*.24:0;
    }
    if(crashT<0)clouds.forEach(cloud=>cloud.position.x+=cloud.userData.drift*dt);
    if(!S.pause){const yi=(S.lf?1:0)-(S.rt?1:0);if(S.speed>30)P.yaw+=yi*dt*.3;roll+=(yi*.3-roll)*dt*3;
      P.x-=Math.sin(P.yaw)*S.speed*1.2*dt;P.z-=Math.cos(P.yaw)*S.speed*1.2*dt}
    sh=crashT>=0?(crashT<.85?(1-crashT/.85)*.12:0):
      (!S.ground&&S.speed<(S.flaps?75:90))?.012:S.ground?S.speed*.00008:0;
    cam.position.set(P.x+(Math.random()-.5)*sh*3,2+S.alt*.1+(Math.random()-.5)*sh*3,P.z);
    cam.rotation.set(rad(S.pitch),P.yaw,roll);yk.rotation.z=roll*2;yk.position.z=-.55+(S.dn?-.06:S.up?.06:0)}}}

/* ---------- ui helpers ---------- */
function scene(html,cls='',w){timers.forEach(clearTimeout);timers=[];S=null;st.className=cls;st.innerHTML=html;if(w)setWorld(w())}
function choices(list){const d=document.createElement('div');d.className='choices';
  list.forEach(([t,f,a])=>{const b=document.createElement('button');b.textContent=t;if(a)b.className='alt';b.onclick=f;d.appendChild(b)});st.appendChild(d)}
function seq(lines,gap,done){lines.forEach((t,i)=>later(()=>{const p=document.createElement('p');
    if(t==='*Ts HELLA SUS*'){const em=document.createElement('em');em.textContent='Ts HELLA SUS';p.appendChild(em)}
    else p.textContent=t;
    st.appendChild(p)},i*gap));if(done)later(done,lines.length*gap)}
function ending(t,r,good){scene(`<h1>${t}</h1><p class="r">${r||''}</p>`,'end'+(good?' good':''),wBlank);choices([['Play again',dream]])}
const died=r=>ending('you died.','Reason: '+r+'.');

/* ---------- story ---------- */
function dream(){scene('','',wDream);
  seq(['I think the plane is falling','Uh oh','Am i cooked...'],2200,()=>choices([['Wake up',checkin]]))}
function checkin(){scene('','',wTerminal);wakeFade();
  seq(['You jolt awake.','"What just happened?"','Whatever. Just a dream.','You walk towards the airport staff person.'],2000,()=>choices([['Hand over passport',passport]]))}
function passport(){scene('<p>Your passport, up close. Move the mouse to tilt it.</p>','',wPassport);
  const st1=()=>{W.stamp();later(()=>choices([['Take passport and board',walk]]),1400);document.getElementById('sb').disabled=true};
  choices([['Stamp passport',st1]]);st.querySelector('button').id='sb';
  R.domElement.onclick=e=>{if(!W.ps||W.stamped)return;const r=new THREE.Raycaster();r.setFromCamera({x:e.clientX/innerWidth*2-1,y:-(e.clientY/innerHeight)*2+1},cam);
    if(r.intersectObject(W.ps).length&&!document.getElementById('sb').disabled)st1()}}
function walk(){R.domElement.onclick=null;scene('','',wBridge);
  seq(['You walk towards the plane.','The events in the dream are still stuck in your head.','You feel like you should turn back.'],2200,
    ()=>choices([['Turn around and leave',()=>ending('you survived.','',true)],['Keep walking',people,true]]))}
function people(){scene('');W.t=-54;
  seq(['A flight attendant gives you a side eye.','A random NPC whips around to stare at you.','Two randos whisper, then look at you as you pass by.','*Ts HELLA SUS*','You ignore it and enter the cockpit'],3300,
    ()=>choices([['Start the flight simulator',()=>startSim('takeoff')]]))}

/* ---------- flight sim ---------- */
function startSim(phase){
  scene(`<div id="guide"></div><div id="hud">
   <div class="box"><h3>INSTRUMENTS</h3><div>Airspeed <span class="num"><span id="spd">0</span><small>kts</small></span></div>
    <div>Altitude <span class="num"><span id="alt">0</span><small>ft</small></span></div>
    <div>Climb <span class="num"><span id="vs">0</span><small>fpm</small></span></div>
    <div>Pitch <span class="num"><span id="pt">0</span><small>deg</small></span></div></div>
   <div class="box"><h3>THROTTLE (slide right = power)</h3><input type="range" id="thr" min="0" max="100" value="0"><span class="num" id="thrv">0%</span></div>
   <div class="box"><h3>STEER: W/S pitch, A/D turn (hold)</h3><div class="ctl"><button id="pu">Nose up</button><button id="pd">Nose down</button><button id="pl">Left</button><button id="pr">Right</button></div></div>
   <div class="box"><h3>FLAPS (F) / GEAR (G)</h3><div class="ctl"><button id="fl" class="alt"></button><button id="gr" class="alt"></button></div></div></div>`,'hudm',()=>wSim(phase));
  S={phase,alt:0,speed:0,pitch:0,thr:0,flaps:false,gear:true,ground:true,vs:0,t:0,task:0,up:0,dn:0,lf:0,rt:0,pause:false,over:false};
  if(phase==='land'){Object.assign(S,{alt:1500,speed:150,pitch:-4,thr:70,gear:false,ground:false});$('thr').value=70}
  $('thr').oninput=e=>S.thr=+e.target.value;
  [['pu','up'],['pd','dn'],['pl','lf'],['pr','rt']].forEach(([id,k])=>{const b=$(id),release=()=>{if(S)S[k]=0};
    b.onpointerdown=()=>{if(S)S[k]=1};b.onpointerup=b.onpointerleave=b.onpointercancel=release});
  $('fl').onclick=()=>S.flaps=!S.flaps;$('gr').onclick=()=>S.gear=!S.gear}
function key(e){if(!S)return;const d=e.type==='keydown'?1:0,k=e.key.toLowerCase();
  if(k==='w'||k==='arrowup')S.up=d;if(k==='s'||k==='arrowdown')S.dn=d;if(k==='a'||k==='arrowleft')S.lf=d;if(k==='d'||k==='arrowright')S.rt=d;
  if(d&&!e.repeat&&k==='f')S.flaps=!S.flaps;if(d&&!e.repeat&&k==='g')S.gear=!S.gear;if(k.startsWith('arrow'))e.preventDefault()}
function clearFlightInput(){if(S){S.up=S.dn=S.lf=S.rt=0}}
addEventListener('keydown',key);addEventListener('keyup',key);
addEventListener('blur',clearFlightInput);
document.addEventListener('visibilitychange',()=>{if(document.hidden)clearFlightInput()});
const TASKS=[
 ['Welcome to the cockpit. First, power: drag the THROTTLE slider all the way to 100%.',s=>s.thr>=95],
 ['Extend flaps for takeoff: press F or the FLAPS button.',s=>s.flaps],
 ['Watch the airspeed. Past about 105 kts, hold W / Nose up until the pitch reads about 8 degrees to lift off.',s=>!s.ground],
 ["You're flying! Climb to 1,000 ft. Too slow and the plane stalls and shakes, so keep your speed up.",s=>s.alt>=1000],
 ['Clean up: raise the gear (G), retract the flaps (F), and ease the throttle to about 60%.',s=>!s.gear&&!s.flaps&&s.thr<=70]];
function sim(dt){
  if(!S.pause){
    if(S.up)S.pitch=Math.min(20,S.pitch+25*dt);if(S.dn)S.pitch=Math.max(-20,S.pitch-25*dt);
    const stall=S.flaps?75:90,target=30+S.thr*1.5-S.pitch*2-(S.gear?10:0)-(S.flaps?8:0);
    S.speed+=(target-S.speed)*.4*dt;
    if(S.ground){S.vs=0;if(S.speed>stall+15&&S.pitch>=4){S.ground=false;S.alt=1}}
    else{S.vs=S.pitch*2.5+(S.speed-110)*.15-(S.speed<stall?(stall-S.speed)*.7:0);S.alt+=S.vs*dt*10;
      if(S.alt<=0){S.alt=0;S.over=true;
        if(S.phase==='land'&&S.pitch>=-5&&S.pitch<=12)return ending('you are alive.','miraculously.',true);
        S.pause=true;
        if(W&&W.explode){W.explode();later(()=>{document.getElementById('crashFx')?.remove();died('incompetence')},4800);return}
        return died('incompetence')}}
    if(S.phase==='takeoff'){if(TASKS[S.task][1](S))S.task++;if(S.task>=TASKS.length){S.phase='fly';S.t=0}}
    if(S.phase==='fly'){S.t+=dt;if(S.t>22&&S.alt>300)noise()}}
  const g=S.phase==='takeoff'?TASKS[S.task][0]:S.phase==='fly'?'Free flight. Hold a steady altitude above 800 ft and keep your speed up. Stay sharp.'
   :'The plane is diving and you have control again. Land with a gentle pitch angle between -5° and +12°. Use W/S to adjust pitch; touchdown angle alone determines whether you survive.';
  $('guide').textContent=g;$('spd').textContent=Math.round(S.speed);$('alt').textContent=Math.round(S.alt);
  $('vs').textContent=Math.round(S.vs*60);$('pt').textContent=S.pitch.toFixed(0);$('thrv').textContent=S.thr+'%';
  $('fl').textContent='Flaps: '+(S.flaps?'EXTENDED':'up');$('gr').textContent='Gear: '+(S.gear?'DOWN':'up')}

/* ---------- the noise ---------- */
function noise(){S.pause=true;
  const o=document.createElement('div');o.id='ov';
  o.innerHTML='<div><p>You suddenly hear a loud thump.</p><p>Your stomach sinks. What do you do?</p><span class="choices"></span></div>';
  document.body.appendChild(o);const c=o.querySelector('.choices');
  [['Go check it out',()=>{o.remove();checkNoise()}],['Keep flying',()=>{o.remove();scene('','',wCabin);W.show=true;
   seq(['You hold your course and ignore it.','The cockpit door bursts open behind you.','Three masked figures rush into the cockpit.'],1800,()=>died('terrorists'))}]]
   .forEach(([t,f])=>{const b=document.createElement('button');b.textContent=t;b.onclick=f;c.appendChild(b)})}
function checkNoise(){scene('','',wCabin);
  seq(['The cockpit door bursts open. Three masked men rush in.','They knock you down and seize the controls.'],1900,()=>{
    later(()=>choices([
      ['Attack with the fire hydrant',()=>{W.swing();scene('');seq(['You wrench the hydrant free and swing from the cockpit floor.','The attackers turn toward you. One of them knocks the hydrant aside.','They overwhelm you before you can recover.'],900,()=>died('reckless'))}],
      ['Stay down and wait',waitIt]
    ]),2400)
  });
  later(()=>W.show=true,400);later(()=>W.low=true,6400)}
function waitIt(){scene('');
  W.argue();
  seq(['You stay still and breathe through the pain.','The men argue, gesturing sharply over the controls.','One turns away. A sidearm slips from his belt and clatters onto the floor.'],2100,
    ()=>{choices([['Pick up the gun',gun],['Stay still',()=>{scene('');seq(['You freeze, eyes shut.','The warmth drains from your side.','The floor feels cold.'],2200,()=>died('coward'))}]]); 
      later(()=>{if(st.querySelector('.choices')){scene('');seq(['You hesitate too long.','Your hands go cold.'],1800,()=>died('coward'))}},9000)});
  later(()=>{W.argue(false);W.dropGun()},4700)}
function gun(){scene('');W.argue(false);W.gunOn=false;
  seq(['You snatch up the gun. The three men fall.','The plane is diving. You crawl to the pilot seat.'],1800,
    ()=>choices([['Take the controls',()=>startSim('land')]]));
  later(()=>W.shoot(),1000)}

/* ---------- main loop ---------- */
let last=performance.now();
(function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;
  if(S&&!S.over)sim(dt);if(W){W.update(dt);R.render(W.scene,cam)}})(last);
setWorld(wBlank());dream();
</script></body></html>
